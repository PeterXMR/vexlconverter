services:
  postgres:
    image: postgres:15-alpine
    container_name: btc_postgres
    environment:
      POSTGRES_DB: btc_converter
      POSTGRES_USER: user
      # Use Compose variable substitution so the value comes from env or .env
      # Provide POSTGRES_PASSWORD in .env or through the environment (e.g. CI secrets).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d btc_converter"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build: ./backend
    container_name: btc_backend
    environment:
      DATABASE_URL: postgresql://user:${POSTGRES_PASSWORD:-changeme}@postgres:5432/btc_converter
      FLASK_ENV: development
      FLASK_PORT: 5001
      COINGECKO_API_URL: https://api.coingecko.com/api/v3/simple/price
      PRICE_UPDATE_INTERVAL: 300
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    ports:
      - "5001:5001"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ./backend:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:5001/api}
    container_name: btc_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
