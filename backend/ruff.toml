# Ruff configuration for the backend.
#
# The rule selection is declared explicitly rather than inherited from ruff's
# built-in defaults. Without this file, `ruff check backend/` lints against
# whatever rule set the latest ruff release happens to ship, so a new ruff
# version can turn CI red on unchanged code. That is exactly what happened:
# ruff 0.16.0 widened its default rule set and produced 21 errors on backend
# code that ruff 0.15.22 had passed cleanly minutes earlier.
#
# The set below is the one backend/ has always been linted against:
#   E4 - pycodestyle, import formatting
#   E7 - pycodestyle, statement formatting
#   E9 - pycodestyle, runtime/syntax errors
#   F  - Pyflakes (undefined names, unused imports, unused variables)
#
# Adopting additional rule families (I, SIM, BLE, TRY, RUF, ...) is a
# deliberate code-quality decision, not something a dependency bump should
# make on our behalf. Add them here explicitly, together with the code changes
# they require.

[lint]
select = ["E4", "E7", "E9", "F"]
