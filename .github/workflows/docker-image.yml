name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  backend-test:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest ruff

      - name: Lint backend with ruff
        run: ruff check backend/

      - name: Run backend tests (if present)
        run: |
          if find backend/tests -name 'test_*.py' 2>/dev/null | grep -q .; then
            pytest backend/tests
          else
            echo "no tests yet"
          fi

  frontend-test:
    name: Frontend (tests + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        env:
          CI: "true"
        run: npm test -- --watchAll=false

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  docker-build:
    name: Docker build + smoke test
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    steps:
      - uses: actions/checkout@v6

      - name: Build all Docker images with docker compose
        run: docker compose build

      - name: Start all services
        run: docker compose up -d

      - name: Wait for backend health (retry)
        run: |
          set -euo pipefail
          for i in {1..30}; do
            if curl -fsS http://localhost:5001/api/health >/dev/null 2>&1; then
              echo "Backend is healthy"
              break
            fi
            echo "Waiting for backend... ($i/30)"
            sleep 3
          done
          if ! curl -fsS http://localhost:5001/api/health >/dev/null 2>&1; then
            echo "Backend failed to respond; dumping logs"
            docker compose logs backend || true
            docker compose down || true
            exit 1
          fi

      - name: Wait for frontend availability (retry)
        run: |
          set -euo pipefail
          for i in {1..20}; do
            if curl -fsS http://localhost:3000 >/dev/null 2>&1; then
              echo "Frontend is serving"
              break
            fi
            echo "Waiting for frontend... ($i/20)"
            sleep 3
          done
          if ! curl -fsS http://localhost:3000 >/dev/null 2>&1; then
            echo "Frontend failed to respond; dumping logs"
            docker compose logs frontend || true
            docker compose down || true
            exit 1
          fi

      - name: Check service logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop services and cleanup
        if: always()
        run: |
          docker compose down
          rm -f .env

  security-scan:
    name: Trivy security scan
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          ignore-unfixed: true
          severity: CRITICAL,HIGH
