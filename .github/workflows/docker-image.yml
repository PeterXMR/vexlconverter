name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

# Default least-privilege token. Individual jobs override only if they
# need write access (none do — Trivy scan, tests, and docker build are
# all read-only with respect to repo content).
permissions:
  contents: read

jobs:
  backend-test:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        # ruff is pinned to a patch-level range. An unpinned `pip install ruff`
        # made lint results depend on the release of the day: ruff 0.16.0
        # widened its default rule set and turned CI red on unchanged backend
        # code that 0.15.22 had passed. backend/ruff.toml now declares the rule
        # selection explicitly, and this pin keeps rule *behaviour* stable too.
        # Bump deliberately — dependabot does not track pip installs in workflow
        # run steps.
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest 'ruff~=0.16.0' pip-audit

      - name: Audit backend dependencies (fail on any known vuln)
        # PYSEC-2024-271 (CVE-2024-1681): flask-cors CRLF log injection.
        # Only triggers when LOG_LEVEL=DEBUG; production defaults to INFO
        # and the app never sets DEBUG in production (FLASK_DEBUG=false,
        # LOG_LEVEL=INFO). Drop this --ignore-vuln once a fixed flask-cors
        # ships. https://github.com/corydolphin/flask-cors
        run: pip-audit -r backend/requirements.txt --ignore-vuln PYSEC-2024-271

      - name: Lint backend with ruff
        run: ruff check backend/

      - name: Run backend tests (if present)
        run: |
          if find backend/tests -name 'test_*.py' 2>/dev/null | grep -q .; then
            pytest backend/tests
          else
            echo "no tests yet"
          fi

  frontend-test:
    name: Frontend (tests + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node 20
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Audit frontend dependencies (fail on high+)
        working-directory: frontend
        # `npm audit` has no native allowlist, so this mirrors the backend's
        # `pip-audit --ignore-vuln` approach: high/critical advisories are read
        # out of the JSON report and matched against ALLOWED_ADVISORIES. Every
        # advisory not listed there still fails the build.
        #
        # GHSA-mh99-v99m-4gvg (brace-expansion: DoS via unbounded expansion).
        # Reachable only through the ESLint 9 dev toolchain — eslint itself,
        # @eslint/eslintrc and eslint-plugin-react all depend on minimatch 3.x,
        # which pulls brace-expansion 1.x. It is a lint-time dependency and is
        # never bundled into the served frontend. The only patched release is
        # brace-expansion 5.0.8, whose CJS build exports a named `expand` rather
        # than a callable default, so pinning it via npm `overrides` breaks
        # minimatch 3.x at runtime ("TypeError: expand is not a function").
        # ESLint 10 depends on a fixed minimatch, but eslint-plugin-react 7.37.5
        # still caps its peer range at eslint ^9.7. Drop this entry once
        # eslint-plugin-react ships ESLint 10 support and the eslint 10 bump can
        # be unignored. https://github.com/advisories/GHSA-mh99-v99m-4gvg
        env:
          ALLOWED_ADVISORIES: GHSA-mh99-v99m-4gvg
        run: |
          set -uo pipefail
          report="$RUNNER_TEMP/npm-audit.json"
          unallowed="$RUNNER_TEMP/npm-audit-unallowed.txt"

          # npm audit exits non-zero whenever it finds anything; severity is
          # decided below, so the exit code here is not the signal we want.
          npm audit --json > "$report" || true

          jq -r --arg allow "$ALLOWED_ADVISORIES" '
            ($allow | split(",") | map(ascii_downcase)) as $allowed
            | [ .vulnerabilities[]?.via[]?
                | select(type == "object")
                | select(.severity == "high" or .severity == "critical")
                | { id: ((.url // "") | split("/") | last),
                    name: .name,
                    severity: .severity,
                    title: .title }
                | select((.id | ascii_downcase) as $id
                         | ($allowed | index($id)) | not)
              ]
            | unique[]
            | "\(.severity)\t\(.name)\t\(.id)\t\(.title)"
          ' "$report" > "$unallowed"

          if [ -s "$unallowed" ]; then
            echo "High/critical advisories outside the allowlist:"
            cat "$unallowed"
            exit 1
          fi

          echo "No high/critical advisories outside the allowlist (${ALLOWED_ADVISORIES})."

      - name: Lint frontend with ESLint
        working-directory: frontend
        run: npm run lint

      - name: Run frontend tests
        working-directory: frontend
        env:
          CI: "true"
        run: npm test

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  docker-build:
    name: Docker build + smoke test
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Build all Docker images with docker compose
        run: docker compose build

      - name: Start all services
        run: docker compose up -d

      - name: Wait for backend health (retry)
        run: |
          set -euo pipefail
          for i in {1..30}; do
            if curl -fsS http://localhost:5001/api/health >/dev/null 2>&1; then
              echo "Backend is healthy"
              break
            fi
            echo "Waiting for backend... ($i/30)"
            sleep 3
          done
          if ! curl -fsS http://localhost:5001/api/health >/dev/null 2>&1; then
            echo "Backend failed to respond; dumping logs"
            docker compose logs backend || true
            docker compose down || true
            exit 1
          fi

      - name: Wait for frontend availability (retry)
        run: |
          set -euo pipefail
          for i in {1..20}; do
            if curl -fsS http://localhost:3000 >/dev/null 2>&1; then
              echo "Frontend is serving"
              break
            fi
            echo "Waiting for frontend... ($i/20)"
            sleep 3
          done
          if ! curl -fsS http://localhost:3000 >/dev/null 2>&1; then
            echo "Frontend failed to respond; dumping logs"
            docker compose logs frontend || true
            docker compose down || true
            exit 1
          fi

      - name: Check service logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop services and cleanup
        if: always()
        run: |
          docker compose down
          rm -f .env

  security-scan:
    name: Trivy security scan
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          ignore-unfixed: true
          severity: CRITICAL,HIGH
