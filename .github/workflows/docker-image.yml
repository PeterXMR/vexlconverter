name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

# Default least-privilege token. Individual jobs override only if they
# need write access (none do — Trivy scan, tests, and docker build are
# all read-only with respect to repo content).
permissions:
  contents: read

jobs:
  backend-test:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest ruff pip-audit

      - name: Audit backend dependencies (fail on any known vuln)
        # PYSEC-2024-271 (CVE-2024-1681): flask-cors CRLF log injection.
        # Only triggers when LOG_LEVEL=DEBUG; production defaults to INFO
        # and the app never sets DEBUG in production (FLASK_DEBUG=false,
        # LOG_LEVEL=INFO). Drop this --ignore-vuln once a fixed flask-cors
        # ships. https://github.com/corydolphin/flask-cors
        run: pip-audit -r backend/requirements.txt --ignore-vuln PYSEC-2024-271

      - name: Lint backend with ruff
        run: ruff check backend/

      - name: Run backend tests (if present)
        run: |
          if find backend/tests -name 'test_*.py' 2>/dev/null | grep -q .; then
            pytest backend/tests
          else
            echo "no tests yet"
          fi

  frontend-test:
    name: Frontend (tests + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Node 20
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Audit frontend dependencies (fail on high+)
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Run frontend tests
        working-directory: frontend
        env:
          CI: "true"
        run: npm test

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  docker-build:
    name: Docker build + smoke test
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Build all Docker images with docker compose
        run: docker compose build

      - name: Start all services
        run: docker compose up -d

      - name: Wait for backend health (retry)
        run: |
          set -euo pipefail
          for i in {1..30}; do
            if curl -fsS http://localhost:5001/api/health >/dev/null 2>&1; then
              echo "Backend is healthy"
              break
            fi
            echo "Waiting for backend... ($i/30)"
            sleep 3
          done
          if ! curl -fsS http://localhost:5001/api/health >/dev/null 2>&1; then
            echo "Backend failed to respond; dumping logs"
            docker compose logs backend || true
            docker compose down || true
            exit 1
          fi

      - name: Wait for frontend availability (retry)
        run: |
          set -euo pipefail
          for i in {1..20}; do
            if curl -fsS http://localhost:3000 >/dev/null 2>&1; then
              echo "Frontend is serving"
              break
            fi
            echo "Waiting for frontend... ($i/20)"
            sleep 3
          done
          if ! curl -fsS http://localhost:3000 >/dev/null 2>&1; then
            echo "Frontend failed to respond; dumping logs"
            docker compose logs frontend || true
            docker compose down || true
            exit 1
          fi

      - name: Check service logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop services and cleanup
        if: always()
        run: |
          docker compose down
          rm -f .env

  security-scan:
    name: Trivy security scan
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          ignore-unfixed: true
          severity: CRITICAL,HIGH
